<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoL Friend Watcher</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔔</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">⚔</span>
    <div>
      <h1>LoL Friend Watcher</h1>
      <p class="brand-sub">登録したプレイヤーのオンラインを見逃さない</p>
    </div>
  </div>
  <div class="topbar-right">
    <div id="conn" class="conn conn-off"><span class="dot"></span><span id="conn-text">接続確認中…</span></div>
    <button id="btn-perm" class="btn btn-ghost" hidden>通知を許可</button>
    <button id="btn-refresh" class="btn btn-ghost" title="今すぐ再取得">↻</button>
    <button id="btn-settings" class="btn btn-ghost">設定</button>
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<main class="layout">
  <!-- 左: フレンド一覧 -->
  <section class="panel">
    <div class="panel-head">
      <h2>フレンド <span id="count-friends" class="badge">0</span></h2>
      <input id="search" type="search" placeholder="名前で検索…" autocomplete="off">
    </div>
    <div class="filters" id="filters">
      <button class="chip chip-on" data-filter="all">すべて</button>
      <button class="chip" data-filter="online">オンライン</button>
      <button class="chip" data-filter="ingame">ゲーム中</button>
      <button class="chip" data-filter="watched">監視中</button>
    </div>
    <div id="friends" class="list"></div>
    <p id="friends-empty" class="empty" hidden></p>
  </section>

  <!-- 右: 監視対象とアラート -->
  <aside class="side">
    <section class="panel">
      <div class="panel-head">
        <h2>監視中 <span id="count-watched" class="badge">0</span></h2>
      </div>
      <div id="watched" class="list list-compact"></div>
      <p id="watched-empty" class="empty">フレンド一覧の ☆ を押すと、そのプレイヤーがオンラインになったときに通知します。</p>
      <div class="manual-add">
        <input id="manual-name" type="text" placeholder="名前#タグ を直接登録（オフライン時用）" autocomplete="off">
        <button id="btn-manual-add" class="btn btn-sm">追加</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>通知ログ</h2>
        <button id="btn-test" class="btn btn-sm btn-ghost">テスト通知</button>
      </div>
      <div id="alerts" class="list list-compact"></div>
      <p id="alerts-empty" class="empty">まだ通知はありません。</p>
    </section>
  </aside>
</main>

<!-- 設定ダイアログ -->
<dialog id="dlg-settings">
  <form method="dialog" class="dlg">
    <h2>設定</h2>

    <label class="field">
      <span>更新間隔（秒）</span>
      <input id="set-interval" type="number" min="2" max="60" step="1">
    </label>

    <label class="field">
      <span>再通知を抑制する時間（分）</span>
      <input id="set-quiet" type="number" min="0" max="600" step="1">
      <small>同じプレイヤーがオン／オフを繰り返しても、この時間内は再通知しません。</small>
    </label>

    <label class="field-check">
      <input id="set-away" type="checkbox">
      <span>離席中・取り込み中もオンラインとして通知する</span>
    </label>

    <label class="field-check">
      <input id="set-sound" type="checkbox">
      <span>通知音を鳴らす</span>
    </label>

    <label class="field">
      <span>Discord Webhook URL（任意）</span>
      <input id="set-webhook" type="url" placeholder="https://discord.com/api/webhooks/…">
      <small>設定するとブラウザを閉じていてもサーバーから通知が届きます。</small>
    </label>

    <div class="dlg-actions">
      <button value="cancel" class="btn btn-ghost">閉じる</button>
      <button id="btn-save" value="save" class="btn btn-primary">保存</button>
    </div>
  </form>
</dialog>

<div id="toasts" class="toasts"></div>

<script src="/app.js"></script>
</body>
</html>
